<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Azachess - Настройки профиля</title>
  <link rel="stylesheet" href="home-style.css?v=3.0">
  <style>
    .settings-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .setting-item label {
      font-weight: 600;
      color: #fff;
    }
    .setting-item select {
      padding: 8px 16px;
      background: var(--bg-dark);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ЛОГИЧНЫЙ ВОЗВРАТ В ЛИЧНЫЙ КАБИНЕТ -->
  <div class="top-profile-bar">
    <a href="profile.html" style="color: var(--accent); text-decoration: none; font-weight: bold;">← В ЛИЧНЫЙ КАБИНЕТ</a>
    <div style="font-weight: bold; color: #fff;">Настройки интерфейса</div>
  </div>

  <div class="hub-container" style="max-width: 500px;">
    
    <!-- БЛОК НАСТРОЕК (ТЕХНИЧЕСКИ ЧИСТЫЙ) -->
    <div class="settings-card" style="margin-top: 20px;">
      <h3 style="margin-top: 0; margin-bottom: 20px; color: #fff; font-size: 1.1rem; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Параметры доски</h3>
      
      <div class="setting-item">
        <label for="set-sound">Звуковое сопровождение</label>
        <input type="checkbox" id="set-sound" checked>
      </div>

      <div class="setting-item">
        <label for="set-hints">Подсказки возможных ходов</label>
        <input type="checkbox" id="set-hints" checked>
      </div>

      <div class="setting-item">
        <label for="set-coords">Координаты на доске</label>
        <input type="checkbox" id="set-coords" checked>
      </div>

      <div class="setting-item">
        <label for="set-autoqueen">Авто-ферзь при превращении</label>
        <input type="checkbox" id="set-autoqueen">
      </div>
      
      <div class="setting-item">
        <label for="set-theme">Визуальная тема доски</label>
        <select id="set-theme">
          <option value="emerald">Изумрудная (Зеленая)</option>
          <option value="classic">Классическая (Дерево)</option>
          <option value="blue">Голубая</option>
          <option value="charcoal">Графит (Темная)</option>
        </select>
      </div>
    </div>

    <button class="start-btn" id="btn-save-settings">Сохранить изменения</button>
  </div>

  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc } from "./firebase-logic.js";

    const setAutoQueen = document.getElementById('set-autoqueen');

    // Читаем значение из памяти
    setAutoQueen.checked = localStorage.getItem('azachess-setting-autoqueen') === 'true';

    // Загрузка текущих настроек из localStorage
    const setSound = document.getElementById('set-sound');
    const setHints = document.getElementById('set-hints');
    const setCoords = document.getElementById('set-coords');
    const setTheme = document.getElementById('set-theme');

    setSound.checked = localStorage.getItem('azachess-setting-sound') !== 'false';
    setHints.checked = localStorage.getItem('azachess-setting-hints') !== 'false';
    setCoords.checked = localStorage.getItem('azachess-setting-coords') !== 'false';
    setTheme.value = localStorage.getItem('azachess-setting-theme') || 'emerald';

    // Сохранение изменений и возврат
    document.getElementById('btn-save-settings').onclick = () => {
      localStorage.setItem('azachess-setting-sound', setSound.checked);
      localStorage.setItem('azachess-setting-hints', setHints.checked);
      localStorage.setItem('azachess-setting-coords', setCoords.checked);
      localStorage.setItem('azachess-setting-theme', setTheme.value);
      localStorage.setItem('azachess-setting-autoqueen', setAutoQueen.checked);

      alert("Настройки сохранены!");
      window.location.href = "profile.html"; // Возврат в Личный Кабинет
    };
  </script>
</body>
</html>
